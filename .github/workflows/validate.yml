name: Validate portfolio

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:tech-text
      - run: git diff --exit-code -- assets/tech-text.bundle.js assets/tech-text.bundle.css
      - run: node --check script.js
      - run: npm run test:browser
      - run: git diff --check
