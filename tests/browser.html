    const coastStarted = frame.contentWindow.performance.now();
    drive.click();
    check(drive.getAttribute('aria-pressed') === 'false' && drive.disabled && explode.disabled && battlebot.currentTime >= beforeStopTime - .01,
      'Stop begins coasting without resetting the current pose');
    await until(() => battlebot.timeScale > 0 && battlebot.timeScale < 1);
    check(!battlebot.paused, 'Drivetrain continues moving while it decelerates');
    await until(() => !drive.disabled && battlebot.paused && battlebot.timeScale === 0);
    const coastDuration = frame.contentWindow.performance.now() - coastStarted;
    check(coastDuration >= 1350 && coastDuration < 2500,
      'Drivetrain coasts down over about 1.5 seconds');
    const stoppedTime = battlebot.currentTime;
    check(stoppedTime > beforeStopTime && stoppedTime > 0, 'Coasting stops at its current nonzero animation pose');
    drive.click();
    check(battlebot.currentTime >= stoppedTime - .01, 'Restart resumes the coasted pose without a jump to zero');
    await until(() => !drive.disabled && battlebot.timeScale === 1);
    drive.click();
    await until(() => !drive.disabled && battlebot.paused && battlebot.timeScale === 0);
    explode.click();
    check(explode.disabled && drive.disabled && $('#battlebot-status').textContent.startsWith('Lifting'),
      'Exploding disables both controls while the animation runs');
    await until(() => $('#battlebot-status').textContent.startsWith('Exploded view:'));
    check(drive.disabled && explode.getAttribute('aria-pressed') === 'true',
      'Exploded state disables the drivetrain and updates its control');
    explode.click();
    check(explode.disabled && drive.disabled && $('#battlebot-status').textContent.startsWith('Reassembling'),
      'Reassembling disables both controls while the animation runs');
    await until(() => $('#battlebot-status').textContent === 'Assembly restored.');
    check($('#battlebot-status').textContent === 'Assembly restored.', 'Assembly completion restores its status');
  }
  check(explode.getAttribute('aria-pressed') === 'false' && (framePrefersReducedMotion ? drive.disabled : !drive.disabled),
    'Reassembling restores both BattleBot controls');
  $('#model-viewer-loader').dispatchEvent(new Event('error'));
  check($('#battlebot-status').textContent.startsWith('3D preview unavailable') && explode.disabled && drive.disabled,
    'A failed model-viewer download leaves a clear source fallback');
  const previousFrameWidth = frame.style.width;
  const canvasPrototype = frame.contentWindow.CanvasRenderingContext2D.prototype;
  const originalCanvasFillText = canvasPrototype.fillText;
  const renderedHeroFonts = [];
  canvasPrototype.fillText = function(text, ...args) {
    if (this.font.includes('Anton')) renderedHeroFonts.push(this.font);
    return originalCanvasFillText.call(this, text, ...args);
  };
  const hasRenderedHeroFont = size => renderedHeroFonts.some(font => {
    const renderedSize = Number(font.match(/([\d.]+)px\s+Anton/)?.[1]);
    return Number.isFinite(renderedSize) && Math.abs(renderedSize - size) < .5;
  });
  const expectedHeroFonts = () => heroTextHosts.map(host => Number.parseFloat(frame.contentWindow.getComputedStyle(host).fontSize));
  const hasRenderedHeroFonts = () => expectedHeroFonts().every(hasRenderedHeroFont);
  let restoredDesktopFonts = [];
  try {
    frame.contentWindow.scrollTo(0, 0);
    frame.style.width = '1500px';
    await until(() => frame.contentWindow.innerWidth === 1500 && hasRenderedHeroFonts());
    frame.style.width = '390px';
    await until(() => frame.contentWindow.innerWidth === 390 && hasRenderedHeroFonts());
    frame.style.width = '1440px';
    await until(() => frame.contentWindow.innerWidth === 1440 && hasRenderedHeroFonts());
    restoredDesktopFonts = expectedHeroFonts();
  } finally {
    canvasPrototype.fillText = originalCanvasFillText;
    frame.style.width = previousFrameWidth;
  }
  check(restoredDesktopFonts.length === heroTextHosts.length && restoredDesktopFonts.every(hasRenderedHeroFont),
    'Hero text keeps its original CSS size when resizing desktop → mobile → desktop without reload');
  document.title = 'PASS — Portfolio regression checks';
  results.textContent = checks.join('\n');
} catch (error) {
  document.title = 'FAIL — Portfolio regression checks';
  results.textContent = checks.join('\n') + '\nFAIL ' + error.message;
  console.error(error);
}
</script>
